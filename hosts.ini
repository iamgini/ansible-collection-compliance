# Inventory for SCAP Compliance Scanning
# Organize hosts by compliance profile group

# RHEL9 hosts - CIS Level 2 Server Profile
# Testing with report server (utils.lab.iamgini.com)
[rhel9_cis_l2]
rhel9101 ansible_host=utils.lab.iamgini.com ansible_user=devops
# ansible_ssh_private_key_file=~/.ssh/id_rsa
# ansible_become_pass=

# Profile configuration is set in group_vars/linux_cis_l2.yml
# Override here only if different from group defaults
[rhel9_cis_l2:vars]
# Add group-level overrides here if needed

# Additional groups for other profiles (uncomment as needed)

# [rhel9_cis_l1]
# rhel9-web-01 ansible_host= ansible_user=

# [rhel9_cis_l1:vars]
# Uses group_vars/linux_cis_l1.yml

# [rhel9_stig]
# rhel9-secure-01 ansible_host= ansible_user=

# [rhel9_stig:vars]
# Uses group_vars/linux_stig.yml

# Report Server - hosts the compliance reports
[report_server]
report_server ansible_host=utils.lab.iamgini.com ansible_user=devops
# ansible_ssh_private_key_file=~/.ssh/id_rsa

# Meta group: All Linux scan targets (excludes report_server)
# Use this group to scan all Linux targets: -e "target_hosts=scan_targets"
[scan_targets:children]
rhel9_cis_l2
# rhel9_cis_l1
# rhel9_stig

